# AeroCause Backend Configuration
# All thresholds and weights are HEURISTIC initial values.
# They are NOT scientifically validated. Tune them with domain expert guidance
# and against real monitoring data before using in production.

spring:
  application:
    name: aerocause-backend
  profiles:
    active: dev  # Override with SPRING_PROFILES_ACTIVE=prod for MySQL

  # JPA
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration

---
# ----- DEVELOPMENT PROFILE (H2 in-memory, no MySQL needed) -----
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:h2:mem:aerocause;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate   # Flyway manages schema

  h2:
    console:
      enabled: true
      path: /h2-console

  flyway:
    url: ${spring.datasource.url}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}

---
# ----- PRODUCTION PROFILE (MySQL) -----
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/aerocause?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${MYSQL_USER:aerocause}
    password: ${MYSQL_PASSWORD:changeme}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate

---
# ----- SHARED CONFIGURATION -----

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# --- External API clients ---
aerocause:
  openaq:
    base-url: https://api.openaq.org/v3
    api-key: ${OPENAQ_API_KEY:}
    timeout-seconds: 10

  open-meteo:
    base-url: https://api.open-meteo.com/v1
    timeout-seconds: 10

  firms:
    enabled: ${FIRE_HOTSPOT_ENABLED:false}
    api-key: ${NASA_FIRMS_API_KEY:}
    base-url: https://firms.modaps.eosdis.nasa.gov/api

  ai-service:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
    timeout-seconds: 30

  # --- Polling (disabled by default; use replay for demo) ---
  ingestion:
    polling-enabled: ${INGESTION_POLLING_ENABLED:false}
    polling-interval-seconds: ${INGESTION_POLLING_INTERVAL_SECONDS:300}
    # Station external IDs to poll (comma-separated)
    station-ids: STN-001,STN-002,STN-003,STN-004

  # ---------------------------------------------------------------
  # QC RULES  — HEURISTIC values; tune with domain expertise
  # ---------------------------------------------------------------
  qc:
    flatline-window: 5          # N identical consecutive readings = flatline
    flatline-tolerance: 0.001   # values within this delta are considered identical
    out-of-range:
      PM25:  { min: 0, max: 1000 }
      PM10:  { min: 0, max: 1500 }
      NO2:   { min: 0, max: 500  }
      SO2:   { min: 0, max: 500  }
      CO:    { min: 0, max: 50   }
      O3:    { min: 0, max: 500  }
    isolated-spike-min-stations: 2   # need at least this many nearby stations to compare
    isolated-spike-ratio: 3.0        # spike station / neighbour ratio threshold
    stale-data-minutes: 90           # reading is stale if observed_at gap > this

  # ---------------------------------------------------------------
  # ANOMALY DETECTION — HEURISTIC values
  # ---------------------------------------------------------------
  anomaly:
    baseline-days: 14          # days of history for same-hour baseline
    baseline-min-readings: 5   # minimum readings to compute a baseline
    robust-z-threshold: 3.5    # MAD-based z-score threshold
    min-absolute-increase:     # µg/m³ (or ppm for CO) minimum increase above baseline
      PM25: 25
      PM10: 50
      NO2:  30
      SO2:  20
      CO:   0.5
      O3:   30
    consecutive-readings: 2    # must persist for at least K readings

  # ---------------------------------------------------------------
  # FINGERPRINTING RULES — HEURISTIC weights; tune with domain expertise
  # NOTE: These weights are initial guesses only.
  #       Validate against labelled historical incidents.
  # ---------------------------------------------------------------
  fingerprinting:
    inconclusive-margin-threshold: 0.15  # if top score - 2nd score < this -> INCONCLUSIVE
    inconclusive-missing-penalty: 0.1    # each missing key evidence reduces confidence

    rules:
      pm-ratio:
        low-ratio-threshold: 0.45    # PM2.5/PM10 < this -> favours DUST
        high-ratio-threshold: 0.60   # PM2.5/PM10 > this -> favours COMBUSTION
        dust-weight: 0.30
        combustion-weight: 0.25

      no2-co:
        no2-threshold-ugm3: 60       # µg/m³ elevated NO2
        co-threshold-ppm: 1.5        # ppm elevated CO
        combustion-weight: 0.30

      so2:
        threshold-ugm3: 40
        industrial-weight: 0.35

      wind:
        low-wind-threshold: 2.0      # m/s; below this favours stagnant weather
        stagnant-blh-threshold: 500  # metres; low BLH + low wind -> stagnant
        stagnant-weight: 0.25
        regional-spread-weight: 0.15 # multiple stations affected from same direction

      fire-hotspot:
        biomass-weight: 0.40

      sensor-fault:
        qc-flag-weight: 0.50
        isolation-weight: 0.30

  # ---------------------------------------------------------------
  # AQI (CPCB-style)
  # IMPORTANT: Verify these breakpoints against the official CPCB
  #            National AQI document before using in any official capacity.
  #            Source: https://cpcb.nic.in/
  # ---------------------------------------------------------------
  aqi:
    breakpoints:
      PM25:
        - { clow: 0,   chigh: 30,  ilow: 0,   ihigh: 50  }
        - { clow: 31,  chigh: 60,  ilow: 51,  ihigh: 100 }
        - { clow: 61,  chigh: 90,  ilow: 101, ihigh: 200 }
        - { clow: 91,  chigh: 120, ilow: 201, ihigh: 300 }
        - { clow: 121, chigh: 250, ilow: 301, ihigh: 400 }
        - { clow: 251, chigh: 500, ilow: 401, ihigh: 500 }
      PM10:
        - { clow: 0,   chigh: 50,  ilow: 0,   ihigh: 50  }
        - { clow: 51,  chigh: 100, ilow: 51,  ihigh: 100 }
        - { clow: 101, chigh: 250, ilow: 101, ihigh: 200 }
        - { clow: 251, chigh: 350, ilow: 201, ihigh: 300 }
        - { clow: 351, chigh: 430, ilow: 301, ihigh: 400 }
        - { clow: 431, chigh: 600, ilow: 401, ihigh: 500 }
      NO2:
        - { clow: 0,   chigh: 40,  ilow: 0,   ihigh: 50  }
        - { clow: 41,  chigh: 80,  ilow: 51,  ihigh: 100 }
        - { clow: 81,  chigh: 180, ilow: 101, ihigh: 200 }
        - { clow: 181, chigh: 280, ilow: 201, ihigh: 300 }
        - { clow: 281, chigh: 400, ilow: 301, ihigh: 400 }
        - { clow: 401, chigh: 800, ilow: 401, ihigh: 500 }
