version: "3.9"

services:
  mysql:
    image: mysql:8.3
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-aerocause}
      MYSQL_USER: ${MYSQL_USER:-aerocause}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-changeme}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-aerocause}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-aerocause}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-changeme}
      OPENAQ_API_KEY: ${OPENAQ_API_KEY:-}
      NASA_FIRMS_API_KEY: ${NASA_FIRMS_API_KEY:-}
      FIRE_HOTSPOT_ENABLED: ${FIRE_HOTSPOT_ENABLED:-false}
      INGESTION_POLLING_ENABLED: ${INGESTION_POLLING_ENABLED:-false}
      AI_SERVICE_URL: http://ai-service:8000
      AEROCAUSE_DATA_DIR: /app/data
      EVALUATION_EXPORT_DIR: /app/docs
    volumes:
      - ./data:/app/data
      - ./docs:/app/docs
    depends_on:
      mysql:
        condition: service_healthy

  ai-service:
    build: ./ai-service
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1/chat/completions}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_API_URL: ${EMBEDDING_API_URL:-https://api.openai.com/v1/embeddings}
      RETRIEVAL_MIN_SIMILARITY: ${RETRIEVAL_MIN_SIMILARITY:-0.25}
      CORPUS_DIR: /app/corpus
      CHROMA_PERSIST_DIR: /app/chromadb_data
    volumes:
      - ./ai-service/corpus:/app/corpus
      - chroma_data:/app/chromadb_data

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
        VITE_AI_API_BASE_URL: /ai
        VITE_POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-10000}
        VITE_OFFICIAL_REPORT_URL: ${OFFICIAL_REPORT_URL:-https://cpcb.nic.in/}
    ports:
      - "${FRONTEND_PORT:-5173}:80"

volumes:
  mysql_data:
  chroma_data:
